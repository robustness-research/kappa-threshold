[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kappa-threshold"
version = "0.1.0"
description = "Python port of the kappa-threshold instance-noise robustness pipeline"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "typer>=0.12",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.20",
    "pls4all>=1.3.16",
]

[project.optional-dependencies]
# JRip (RIPPER) and PART (IREP substitute) in scripts/models.py
rules = ["wittgenstein>=0.3", "imodels>=3.0"]  # imodels: rfRules (SkopeRules)
# gcvEarth (MARS). py-earth2 currently ships wheels for CPython 3.13 only;
# imports as `pyearth`. The original py-earth / PyPI "pyearth" do not work.
earth = ["py-earth2>=0.2; python_version >= '3.13'"]
notebooks = ["jupyter>=1.0", "ipykernel>=6.29", "itables>=2.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[project.scripts]
kt = "scripts.utilities.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
